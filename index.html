<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tragic Anime Simulation: Separation & Fate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050206; font-family: 'Times New Roman', serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Cinematic Widescreen Letterbox Bars */
        .cinematic-bar { position: absolute; left: 0; width: 100%; height: 12%; background: #000; z-index: 10; }
        .top-bar { top: 0; border-bottom: 1px solid #331111; }
        .bottom-bar { bottom: 0; border-top: 1px solid #331111; }

        /* Story Subtitle Overlay */
        .subtitle-box {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            text-align: center;
            width: 80%;
            pointer-events: none;
        }
        #subtitle {
            font-size: 1.8rem;
            color: #ffffff;
            text-shadow: 0 0 10px #000000, 0 0 20px rgba(139, 0, 0, 0.8);
            font-style: italic;
            margin: 0;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }
        
        /* Timeline Interface HUD */
        #act-indicator {
            position: absolute;
            top: 15%;
            left: 5%;
            z-index: 12;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 5px #000;
        }
    </style>
    <!-- Core 3D Graphics WebGL Engine Library -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="cinematic-bar top-bar"></div>
    <div id="act-indicator">NARRATIVE MATRIX: STANDBY</div>
    
    <div class="subtitle-box">
        <p id="subtitle">"The twilight bleeds... signaling the end of our timeline."</p>
    </div>
    
    <div class="cinematic-bar bottom-bar"></div>
    <div id="canvas-container"></div>

    <script>
        // 1. Scene, Camera, and WebGL Renderer Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050206, 0.025); // Heavy atmospheric depth fog

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. Battlefield Dust, Ash & Burning Ember Systems
        const particleCount = 2000;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // Distribute across 3D space matrix boundaries
            positions[i * 3] = (Math.random() - 0.5) * 70;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 70;

            // Color weights: Mix burning scarlet particles with cold charcoal ash
            if (Math.random() > 0.4) {
                colors[i * 3] = 0.8 + Math.random() * 0.2; // Glowing Red
                colors[i * 3 + 1] = 0.15;                  // Minor Orange Tint
                colors[i * 3 + 2] = 0.05;
            } else {
                colors[i * 3] = 0.25; colors[i * 3 + 1] = 0.25; colors[i * 3 + 2] = 0.3; // Ash Gray
            }
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.3,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const atmosphereMesh = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(atmosphereMesh);

        // 3. Symbolic Entities: The Fractured Destinies (Two floating spirit spheres)
        const coreGeometry = new THREE.SphereGeometry(1.2, 32, 32);
        
        const materialA = new THREE.MeshBasicMaterial({ color: 0xff2222 }); // Crimson Core (War & Pain)
        const entityA = new THREE.Mesh(coreGeometry, materialA);
        scene.add(entityA);

        const materialB = new THREE.MeshBasicMaterial({ color: 0x2288ff }); // Cerulean Core (Memories & Separation)
        const entityB = new THREE.Mesh(coreGeometry, materialB);
        scene.add(entityB);

        // Cinematic Impact Strike Overlay Flash Mesh
        const flashGeometry = new THREE.PlaneGeometry(300, 300);
        const flashMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
        const flashScreen = new THREE.Mesh(flashGeometry, flashMaterial);
        flashScreen.position.z = -5;
        scene.add(flashScreen);

        // 4. Algorithmic Story Script Timeline
        const chapters = [
            { act: "ACT I: THE RUPTURE", text: "The sky fragments. The cost of love was higher than we ever imagined.", flash: false },
            { act: "ACT II: THE STRIKE", text: "A flash of light. A devastating strike breaks our physical ties.", flash: true },
            { act: "ACT III: THE DRIFT", text: "Even as we fade into separate realities, our internal loops remain linked.", flash: false },
            { act: "ACT IV: THE VOID", text: "The battle ends in total silence... leaving only drifting dust in the void.", flash: false }
        ];

        let activeSegment = -1;
        const runtimeClock = new THREE.Clock();

        function processStoryTimeline(elapsedTime) {
            // Cycle narrative automatically every 8 seconds across the infinite loop
            const targetSegment = Math.floor((elapsedTime / 8) % chapters.length);
            
            if (targetSegment !== activeSegment) {
                activeSegment = targetSegment;
                const activeChapter = chapters[activeSegment];
                
                // Beautiful CSS opacity text transition triggers
                const textDOM = document.getElementById('subtitle');
                textDOM.style.opacity = 0;
                
                setTimeout(() => {
                    textDOM.innerText = activeChapter.text;
                    document.getElementById('act-indicator').innerText = `NARRATIVE MATRIX: ${activeChapter.act}`;
                    textDOM.style.opacity = 1;
                }, 400);

                if (activeChapter.flash) {
                    flashScreen.material.opacity = 0.9; // Trigger blinding impact strike
                }
            }
        }

        // 5. Physics Simulation Animation Frame Loop
        function executeSimulation() {
            requestAnimationFrame(executeSimulation);
            const totalSeconds = runtimeClock.getElapsedTime();

            processStoryTimeline(totalSeconds);

            // Decay flash intensity frame by frame
            if (flashScreen.material.opacity > 0) {
                flashScreen.material.opacity -= 0.05;
            }

            // Expand separation distance of cores smoothly over timeline ticks
            const driftDelta = 1.5 + (totalSeconds % 32) * 0.35;
            entityA.position.set(-driftDelta, Math.sin(totalSeconds * 1.5) * 0.6, 0);
            entityB.position.set(driftDelta, Math.cos(totalSeconds * 1.5) * 0.6, 0);

            // Swirl atmospheric dust particles gently around field centers
            atmosphereMesh.rotation.y = totalSeconds * 0.04;
            atmosphereMesh.rotation.x = Math.sin(totalSeconds * 0.01) * 0.15;

            // Dramatic, slow camera orbit pan setup
            camera.position.x = Math.sin(totalSeconds * 0.15) * 5;
            camera.position.y = Math.cos(totalSeconds * 0.1) * 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Handle browser window size transformations smoothly
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize Engine
        executeSimulation();
    </script>
</body>
</html>
<!-- HTML5 Background Audio Player with Vol Controls -->
<audio id="bg-music" src="music.mp3" loop autoplay></audio>

<script>
    // Modern browsers block autoplay until the user clicks the screen
    window.addEventListener('click', () => {
        const audio = document.getElementById('bg-music');
        audio.volume = 0.5; // Sets volume level to 50%
        audio.play();
    });
</script>
